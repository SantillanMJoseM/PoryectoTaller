# Despliegue local: solo el frontend (SPA Vite/React ya compilada en dist/).
# El backend lo gestiona Supabase CLI (`supabase start`), no este compose.
services:
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
